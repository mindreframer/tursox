[package]
name = "tursox_nif"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["nif_version_2_16"]
nif_version_2_16 = ["rustler/nif_version_2_16"]

[dependencies]
rustler = "=0.38.0"
tokio = { version = "=1.47.1", features = ["rt-multi-thread"] }
turso = { version = "=0.7.2", default-features = false }
