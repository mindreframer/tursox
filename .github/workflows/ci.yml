name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.3"
          elixir-version: "1.20.1"
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.cargo/registry
            native/tursox_nif/target
          key: qa-${{ runner.os }}-${{ hashFiles('mix.lock', 'native/tursox_nif/Cargo.lock') }}
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get
      - run: bin/qa_check.sh
